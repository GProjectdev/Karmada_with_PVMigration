apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pvmetadata.migration.dcnlab.com
spec:
  group: migration.dcnlab.com
  names:
    kind: PVMetadata
    listKind: PVMetadataList
    plural: pvmetadata
    singular: pvmetadata
    shortNames:
      - pvm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "spec is immutable after creation"
              required:
                - workloadRef
                - sourceCluster
              properties:
                workloadRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                    uid:
                      type: string
                      maxLength: 253
                sourceCluster:
                  type: string
                  minLength: 1
                  maxLength: 253
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                ready:
                  type: boolean
                message:
                  type: string
                collectedAt:
                  type: string
                  format: date-time
                workloadUID:
                  type: string
                volumes:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - pvcName
                  items:
                    type: object
                    required:
                      - pvcName
                    properties:
                      pvcName:
                        type: string
                      pvcUID:
                        type: string
                      templateName:
                        type: string
                      ordinal:
                        type: integer
                        format: int32
                      pvName:
                        type: string
                      pvSpec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                clusters:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - clusterName
                  items:
                    type: object
                    required:
                      - clusterName
                    properties:
                      clusterName:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      ready:
                        type: boolean
                      message:
                        type: string
                      collectedAt:
                        type: string
                        format: date-time
                      workloadUID:
                        type: string
                      volumes:
                        type: array
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys:
                          - pvcName
                        items:
                          type: object
                          required:
                            - pvcName
                          properties:
                            pvcName:
                              type: string
                            pvcUID:
                              type: string
                            templateName:
                              type: string
                            ordinal:
                              type: integer
                              format: int32
                            pvName:
                              type: string
                            pvSpec:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.sourceCluster
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: SourceReady
          type: boolean
          jsonPath: .status.clusters[0].ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
