apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pvmigrations.migration.dcnlab.com
spec:
  group: migration.dcnlab.com
  names:
    kind: PVMigration
    listKind: PVMigrationList
    plural: pvmigrations
    singular: pvmigration
    shortNames:
      - pvmig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "spec is immutable after creation"
              required:
                - metadataRef
                - sourceCluster
                - targetCluster
                - resourceBinding
                - sourceFenced
                - volumes
              properties:
                metadataRef:
                  type: string
                  minLength: 1
                  maxLength: 253
                sourceCluster:
                  type: string
                  minLength: 1
                  maxLength: 253
                targetCluster:
                  type: string
                  minLength: 1
                  maxLength: 253
                resourceBinding:
                  type: string
                  minLength: 1
                  maxLength: 253
                sourceFenced:
                  type: boolean
                volumes:
                  type: array
                  minItems: 1
                  maxItems: 128
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - sourcePVC
                  items:
                    type: object
                    required:
                      - sourcePVC
                      - targetPVC
                    properties:
                      sourcePVC:
                        type: string
                        minLength: 1
                        maxLength: 253
                      targetPVC:
                        type: string
                        minLength: 1
                        maxLength: 253
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum:
                    - ""
                    - Pending
                    - Preparing
                    - Ready
                    - Completed
                    - Failed
                message:
                  type: string
                planHash:
                  type: string
                  maxLength: 64
                works:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                      - namespace
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      applied:
                        type: boolean
                      detached:
                        type: boolean
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Source
          type: string
          jsonPath: .spec.sourceCluster
        - name: Target
          type: string
          jsonPath: .spec.targetCluster
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
