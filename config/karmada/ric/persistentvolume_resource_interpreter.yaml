apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: persistentvolume
spec:
  target:
    apiVersion: v1
    kind: PersistentVolume
  customizations:
    statusReflection:
      luaScript: |
        function ReflectStatus(observedObj)
          if observedObj.status == nil then
            return {}
          end
          local metadata = observedObj.metadata or {}
          local spec = observedObj.spec or {}
          local labels = metadata.labels or {}
          return {
            phase = observedObj.status.phase,
            uid = metadata.uid,
            deletionTimestamp = metadata.deletionTimestamp,
            migrationUID = labels["migration.dcnlab.com/migration-uid"],
            claimRef = spec.claimRef,
            nfs = spec.nfs
          }
        end
