apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-migration-management
  labels:
    app.kubernetes.io/name: pv-migration-system
    app.kubernetes.io/component: management-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pv-migration-system
      app.kubernetes.io/component: management-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pv-migration-system
        app.kubernetes.io/component: management-controller
    spec:
      serviceAccountName: pv-migration-management
      containers:
        - name: manager
          image: ghcr.io/gprojectdev/pv-migration-system:dev
          imagePullPolicy: IfNotPresent
          args:
            - --mode=management
            - --kubeconfig=/etc/karmada/kubeconfig
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --leader-election-namespace=pv-migration-system
            - --poll-interval=15s
            - --leader-elect=true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          volumeMounts:
            - name: karmada-kubeconfig
              mountPath: /etc/karmada
              readOnly: true
      volumes:
        - name: karmada-kubeconfig
          secret:
            secretName: karmada-kubeconfig
            items:
              - key: kubeconfig
                path: kubeconfig
