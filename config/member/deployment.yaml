apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-migration-member
  labels:
    app.kubernetes.io/name: pv-migration-system
    app.kubernetes.io/component: member-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pv-migration-system
      app.kubernetes.io/component: member-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pv-migration-system
        app.kubernetes.io/component: member-controller
    spec:
      serviceAccountName: pv-migration-member
      containers:
        - name: manager
          image: ghcr.io/gprojectdev/pv-migration-system:dev
          imagePullPolicy: IfNotPresent
          args:
            - --mode=member
            - --cluster-name=aws
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --leader-election-namespace=pv-migration-system
            - --poll-interval=15s
            - --leader-elect=true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
